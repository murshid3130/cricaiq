<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehrab Ali - ESPN Data Terminal</title>
    <style>
        body { font-family: 'Roboto', sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 0; }
        .top-bar { background: #03a9f4; padding: 10px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .branding { background: #000; padding: 5px; text-align: center; font-size: 0.8rem; color: #03a9f4; }
        
        /* ESPN Style Live Card */
        .match-container { padding: 15px; }
        .espn-card { background: #2b2b2b; border-radius: 8px; overflow: hidden; border-bottom: 4px solid #03a9f4; margin-bottom: 20px; }
        
        .live-tag { background: #d71920; color: white; padding: 2px 8px; font-size: 0.7rem; font-weight: bold; border-radius: 3px; margin: 10px; display: inline-block; }
        
        iframe { width: 100%; height: 500px; border: none; background: white; }
        
        .ai-analysis { background: #333; padding: 15px; margin: 15px; border-radius: 5px; border-left: 4px solid #03a9f4; }
        .footer { text-align: center; font-size: 0.7rem; color: #888; padding: 20px; }
    </style>
</head>
<body>

    <div class="top-bar">CRIC-INFO TERMINAL</div>
    <div class="branding">DEVELOPED BY MEHRAB ALI</div>

    <div class="match-container">
        <div class="ai-analysis">
            <strong style="color: #03a9f4;">MEHRAB'S AI ADVISOR:</strong>
            <p id="insight">Fetching latest ball-by-ball data from Cricinfo streams...</p>
        </div>

        <div class="espn-card">
            <div class="live-tag">LIVE NOW</div>
            <iframe src="https://m.cricbuzz.com/cricket-match/live-scores"></iframe>
        </div>
    </div>

    <div class="footer">Data synced via Public Streams | System by Mehrab Ali</div>

    <script>
        const matchInsights = [
            "Pitch Report: Surface is getting slower, spinners like Rashid Khan would be deadly here.",
            "Win Prediction: Team chasing has a 62% historical win rate on this ground.",
            "Mehrab's Tip: The next 10 overs are crucial. Expect a flurry of wickets if the RR crosses 9.",
            "Weather Alert: No rain expected, full 40/100 overs play possible."
        ];

        setInterval(() => {
            document.getElementById('insight').innerText = matchInsights[Math.floor(Math.random() * matchInsights.length)];
        }, 15000);
    </script>
</body>
</html>
